name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Preparar pasta www
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NEONTV.apk
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEONTV v1.0.${{ github.run_number }}
          files: NEONTV.apk
          
